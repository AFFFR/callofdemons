<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airsoft Quest — Game Master</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/gm/style.css"></head><body>
<header><h1>🎮 Airsoft Quest — GAME MASTER</h1><div id="top" class="hidden"><span id="codeLabel"></span> · RED <b id="rscore">0</b> · BLUE <b id="bscore">0</b></div></header>
<section id="login" class="card login"><h2>Game Master</h2><label>Código da partida</label><input id="game" placeholder="AQ-7K42"><label>Código GM</label><input id="gm" type="password"><label>Código equipa RED</label><input id="redCode" type="password" placeholder="Código privado RED"><label>Código equipa BLUE</label><input id="blueCode" type="password" placeholder="Código privado BLUE"><div class="row"><button class="primary" id="create">CRIAR NOVA PARTIDA</button><button id="enter">ENTRAR NUMA PARTIDA</button></div><div id="err" class="small"></div></section>
<main id="main" class="hidden"><div class="card"><div class="row"><button class="primary" id="start">INICIAR JOGO</button><button id="stop">PARAR JOGO</button><button class="danger" id="reset">REINICIAR</button></div><label>Visibilidade dos objetivos</label><select id="visibility"><option value="discovery">Sequência / descoberta</option><option value="all">Todos visíveis</option></select></div>
<div class="card"><h2>Códigos das equipas</h2><label>Código equipa RED</label><input id="redCodeEdit" type="password"><label>Código equipa BLUE</label><input id="blueCodeEdit" type="password"><div class="row"><button id="saveTeamCodes">GUARDAR CÓDIGOS</button></div><div id="teamCodeMsg" class="small"></div></div>
<div class="card"><h2>Novo objetivo</h2><label>Nome</label><input id="name" placeholder="Objetivo 1"><label>Descrição</label><textarea id="desc" rows="3"></textarea><label>Equipa</label><select id="team"><option value="RED">RED</option><option value="BLUE">BLUE</option><option value="BOTH">AMBAS</option></select><label>Pontos</label><input id="points" type="number" value="10"><label>Raio de captura (metros)</label><input id="radius" type="number" value="30"><label>Código QR</label><input id="qr" placeholder="ex.: AQ-OBJ-001"><label>Coordenadas</label><div class="row"><input id="lat" placeholder="Latitude"><input id="lon" placeholder="Longitude"><button id="mygps">📍 Usar GPS atual</button></div><label>Fotografia</label><input id="photo" type="file" accept="image/*"><div class="row"><button class="primary" id="add">CRIAR OBJETIVO</button></div></div>
<div id="map"></div><div class="card"><h2>Objetivos</h2><div id="objects"></div></div><div class="card"><h2>Jogadores</h2><div id="players"></div></div></main>
<script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/gm/app.js?v=7"></script></body></html>
